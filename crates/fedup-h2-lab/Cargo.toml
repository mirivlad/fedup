[package]
name = "fedup-h2-lab"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standards-compliant HTTP/2 streaming over mTLS, loopback-only research lab"

[dependencies]
bytes = "1"
fedup-identity = { path = "../fedup-identity" }
h2 = "0.4"
http = "1"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = "0.26"
