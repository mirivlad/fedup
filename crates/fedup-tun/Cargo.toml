[package]
name = "fedup-tun"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-client Linux IP TUN lab over mTLS; restricted lab subnet only"

[dependencies]
fedup-core = { path = "../fedup-core" }
bytes = "1"
h2 = "0.4"
http = "1"
fedup-identity = { path = "../fedup-identity" }
fedup-protocol = { path = "../fedup-protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2"
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = "0.26"
tokio-tun = "=0.15.2"
sha2 = "0.10"
