[package]
name = "fedup-auth"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Loopback-only FedUp password authentication API, intended for a correctly configured HTTPS reverse proxy"

[dependencies]
axum = { version = "0.8", features = ["json"] }
fedup-users = { path = "../fedup-users" }
hex = "0.4"
rand = "0.8"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls-pemfile = "2.2"
sha2 = "0.10"
time = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.48", features = ["full"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
