[package]
name = "fedup-link"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental mutually authenticated single-destination TCP link; NOT a VPN"

[dependencies]
fedup-protocol = { path = "../fedup-protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2"
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = "0.26"
sha2 = "0.10"
