[package]
name = "fedup-identity"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local encrypted device keys, CSRs and certificate import for experimental FedUp"

[[bin]]
name = "fedup-device"
path = "src/main.rs"

[dependencies]
openssl = "0.10.81"
rpassword = "7.5"
rustls-pemfile = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
