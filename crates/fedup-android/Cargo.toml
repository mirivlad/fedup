[package]
name = "fedup-android"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental Android JNI adapter to the portable FedUp IP packet policy"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fedup-core = { path = "../fedup-core" }
jni = { version = "0.21.1", default-features = false }
