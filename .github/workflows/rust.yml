name: Rust laboratory checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Unit tests
        run: cargo test --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile parser fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bin frame_parser
      - name: Build one-shot mTLS lab
        run: cargo build -p fedup-lab
      - name: Exercise lab protocol and certificate verification
        run: bash tests/lab-smoke.sh
      - name: Build experimental TCP link and admin CLI
        run: cargo build -p fedup-link -p fedup-admin
      - name: Exercise end-to-end link and revocation
        run: bash tests/link-smoke.sh
      - name: Build offline enrollment issuer
        run: cargo build -p fedup-enroll
      - name: Verify one-time CSR certificate issuance and recovery
        run: bash tests/enroll-smoke.sh
      - name: Build encrypted identity client
        run: cargo build -p fedup-identity
      - name: Verify encrypted key creation and end-to-end mTLS
        run: bash tests/device-smoke.sh

  h2-laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Build real HTTP/2 and identity tools
        run: cargo build -p fedup-h2-lab -p fedup-enroll -p fedup-identity -p fedup-admin
      - name: Verify ALPN h2, bidirectional flow control and revocation
        run: bash tests/h2-smoke.sh

  tun-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Install Linux namespace test tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping libssl-dev pkg-config curl tcpdump
      - name: Build experimental TUN, enrollment and administration
        run: cargo build -p fedup-tun -p fedup-identity -p fedup-enroll -p fedup-admin
      - name: Verify isolated namespaces and parse synthetic TLS ClientHello
        run: |
          mkdir -p "$RUNNER_TEMP/fedup-profile"
          sudo env FEDUP_CAPTURE_PCAP="$RUNNER_TEMP/fedup-profile/tun.pcap" bash tests/tun-smoke.sh
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/fedup-profile/tun.pcap"
          sudo chmod 0644 "$RUNNER_TEMP/fedup-profile/tun.pcap"
          stat -c 'Synthetic PCAP permissions: %a %U:%G %s bytes' "$RUNNER_TEMP/fedup-profile/tun.pcap"
          python3 - "$RUNNER_TEMP/fedup-profile/tun.pcap" <<'PY'
          import os,sys
          assert os.access(sys.argv[1], os.R_OK), "PCAP inaccessible to runner"
          with open(sys.argv[1], "rb") as capture:
              assert capture.read(4), "empty PCAP"
          PY
          python3 tools/traffic-profile.py "$RUNNER_TEMP/fedup-profile/tun.pcap" --output "$RUNNER_TEMP/fedup-profile/report.json"
          cat "$RUNNER_TEMP/fedup-profile/report.json"
          python3 - "$RUNNER_TEMP/fedup-profile/report.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result["fedup"]["client_hello_count"] > 0, "no FedUp ClientHello"
          assert result["https_reference"]["client_hello_count"] > 0, "no baseline HTTPS ClientHello"
          print("TLS fingerprint extraction from synthetic FedUp and HTTPS captures: PASS")
          PY
      - name: Verify genuine HTTP/2 packet routing and ALPN h2
        run: |
          sudo env FEDUP_TUN_TRANSPORT=h2 FEDUP_CAPTURE_PCAP="$RUNNER_TEMP/fedup-profile/tun-h2.pcap" bash tests/tun-smoke.sh
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/fedup-profile/tun-h2.pcap"
          python3 tools/traffic-profile.py "$RUNNER_TEMP/fedup-profile/tun-h2.pcap" --output "$RUNNER_TEMP/fedup-profile/h2-report.json"
          python3 - "$RUNNER_TEMP/fedup-profile/report.json" "$RUNNER_TEMP/fedup-profile/h2-report.json" <<'PY'
          import json,sys
          raw=json.load(open(sys.argv[1]))["fedup"]["client_hello_visible"][0]
          h2=json.load(open(sys.argv[2]))["fedup"]["client_hello_visible"][0]
          assert raw["offered_alpn"] == [], "raw carrier unexpectedly advertises ALPN"
          assert h2["offered_alpn"] == ["h2"], f"genuine HTTP/2 carrier did not offer h2: {h2}"
          print("Real HTTP/2 IP tunnel carried IPv4/IPv6 TCP/UDP/DNS and negotiated ALPN h2: PASS")
          PY
