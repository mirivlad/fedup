name: Rust laboratory checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Unit tests
        run: cargo test --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile parser fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bin frame_parser
      - name: Build one-shot mTLS lab
        run: cargo build -p fedup-lab
      - name: Exercise lab protocol and certificate verification
        run: bash tests/lab-smoke.sh
      - name: Build experimental TCP link and admin CLI
        run: cargo build -p fedup-link -p fedup-admin
      - name: Exercise end-to-end link and revocation
        run: bash tests/link-smoke.sh
      - name: Build offline enrollment issuer
        run: cargo build -p fedup-enroll
      - name: Verify one-time CSR certificate issuance and recovery
        run: bash tests/enroll-smoke.sh
      - name: Build encrypted identity client
        run: cargo build -p fedup-identity
      - name: Verify encrypted key creation and end-to-end mTLS
        run: bash tests/device-smoke.sh

  h2-laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Build real HTTP/2 and identity tools
        run: cargo build -p fedup-h2-lab -p fedup-enroll -p fedup-identity -p fedup-admin
      - name: Verify ALPN h2, bidirectional flow control and revocation
        run: bash tests/h2-smoke.sh

  android-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK manager
        uses: android-actions/setup-android@v3
        with:
          # The removed legacy "tools" package is still in the action default.
          packages: platform-tools
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK, NDK and native Rust target
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          rustup target add aarch64-linux-android
      - name: Cross-check Rust JNI bridge
        run: cargo check -p fedup-android --target aarch64-linux-android
      - name: Build Rust arm64-v8a shared library with NDK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p fedup-android
          test -s android/app/src/main/jniLibs/arm64-v8a/libfedup_android.so
      - name: Compile Android lab APK and test fail-closed activation gate
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Check manifest declares VPN service but disables unsupported Always-on
        run: |
          grep -q 'android.permission.BIND_VPN_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.net.VpnService.SUPPORTS_ALWAYS_ON' android/app/src/main/AndroidManifest.xml
          grep -q 'android:value="false"' android/app/src/main/AndroidManifest.xml

  core-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Windows and Android Rust standard library targets
        run: rustup target add x86_64-pc-windows-gnu aarch64-linux-android
      - name: Check OS-independent core for Windows
        run: cargo check -p fedup-core --target x86_64-pc-windows-gnu
      - name: Check OS-independent core for Android
        run: cargo check -p fedup-core --target aarch64-linux-android
      - name: Check OS-independent core for Linux
        run: cargo test -p fedup-core

  tun-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Install Linux namespace test tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping libssl-dev pkg-config curl tcpdump nftables
      - name: Build experimental TUN, enrollment and administration
        run: cargo build -p fedup-tun -p fedup-identity -p fedup-enroll -p fedup-admin -p fedup-netguard
      - name: Verify isolated namespaces and parse synthetic TLS ClientHello
        run: |
          mkdir -p "$RUNNER_TEMP/fedup-profile"
          sudo env FEDUP_CAPTURE_PCAP="$RUNNER_TEMP/fedup-profile/tun.pcap" bash tests/tun-smoke.sh
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/fedup-profile/tun.pcap"
          sudo chmod 0644 "$RUNNER_TEMP/fedup-profile/tun.pcap"
          stat -c 'Synthetic PCAP permissions: %a %U:%G %s bytes' "$RUNNER_TEMP/fedup-profile/tun.pcap"
          python3 - "$RUNNER_TEMP/fedup-profile/tun.pcap" <<'PY'
          import os,sys
          assert os.access(sys.argv[1], os.R_OK), "PCAP inaccessible to runner"
          with open(sys.argv[1], "rb") as capture:
              assert capture.read(4), "empty PCAP"
          PY
          python3 tools/traffic-profile.py "$RUNNER_TEMP/fedup-profile/tun.pcap" --output "$RUNNER_TEMP/fedup-profile/report.json"
          cat "$RUNNER_TEMP/fedup-profile/report.json"
          python3 - "$RUNNER_TEMP/fedup-profile/report.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result["fedup"]["client_hello_count"] > 0, "no FedUp ClientHello"
          assert result["https_reference"]["client_hello_count"] > 0, "no baseline HTTPS ClientHello"
          print("TLS fingerprint extraction from synthetic FedUp and HTTPS captures: PASS")
          PY
      - name: Verify genuine HTTP/2 packet routing and ALPN h2
        run: |
          sudo env FEDUP_TUN_TRANSPORT=h2 FEDUP_CAPTURE_PCAP="$RUNNER_TEMP/fedup-profile/tun-h2.pcap" bash tests/tun-smoke.sh
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/fedup-profile/tun-h2.pcap"
          python3 tools/traffic-profile.py "$RUNNER_TEMP/fedup-profile/tun-h2.pcap" --output "$RUNNER_TEMP/fedup-profile/h2-report.json"
          python3 - "$RUNNER_TEMP/fedup-profile/report.json" "$RUNNER_TEMP/fedup-profile/h2-report.json" <<'PY'
          import json,sys
          raw=json.load(open(sys.argv[1]))["fedup"]["client_hello_visible"][0]
          h2=json.load(open(sys.argv[2]))["fedup"]["client_hello_visible"][0]
          assert raw["offered_alpn"] == [], "raw carrier unexpectedly advertises ALPN"
          assert h2["offered_alpn"] == ["h2"], f"genuine HTTP/2 carrier did not offer h2: {h2}"
          print("Real HTTP/2 IP tunnel carried IPv4/IPv6 TCP/UDP/DNS and negotiated ALPN h2: PASS")
          PY
      - name: Fault injection - direct-route kill switch and lossy raw TLS
        run: sudo env FEDUP_TUN_TRANSPORT=raw FEDUP_TUN_FAULT=1 bash tests/tun-smoke.sh
      - name: Fault injection - direct-route kill switch and lossy HTTP/2
        run: sudo env FEDUP_TUN_TRANSPORT=h2 FEDUP_TUN_FAULT=1 bash tests/tun-smoke.sh
      - name: Test repeatable traffic study aggregator
        run: python3 tools/test-traffic-study.py
      - name: Repeated matched synthetic traffic comparison
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fedup-study"
          for mode in raw h2; do
            for iteration in 1 2 3; do
              prefix="$RUNNER_TEMP/fedup-study/$mode-$iteration"
              if ! sudo env FEDUP_TUN_TRANSPORT="$mode" FEDUP_CAPTURE_PCAP="$prefix.pcap"                 bash tests/tun-smoke.sh >"$prefix.log" 2>&1; then
                cat "$prefix.log"
                exit 1
              fi
              sudo chown "$(id -u):$(id -g)" "$prefix.pcap"
              python3 tools/traffic-profile.py "$prefix.pcap" --output "$prefix.json"
              echo "Captured matched workload $mode/$iteration"
            done
          done
          python3 tools/traffic-study.py             --raw "$RUNNER_TEMP"/fedup-study/raw-*.json             --h2 "$RUNNER_TEMP"/fedup-study/h2-*.json             --output "$RUNNER_TEMP/fedup-study/study.json"
          cat "$RUNNER_TEMP/fedup-study/study.json"
          python3 - "$RUNNER_TEMP/fedup-study/study.json" <<'PY'
          import json,sys
          results=json.load(open(sys.argv[1]))
          assert results["raw_tls"]["independent_captures"] == 3
          assert results["real_http2"]["independent_captures"] == 3
          assert results["raw_tls"]["offered_alpn"] == []
          assert results["real_http2"]["offered_alpn"] == ["h2"]
          assert "detection_rate" not in results
          print("Repeated controlled raw/h2 TLS characterization: PASS; no DPI rate inferred")
          PY
